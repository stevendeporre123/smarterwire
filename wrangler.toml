name = "smarterwire"
main = "cloudflare/worker.ts"
compatibility_date = "2025-01-01"

# Persistente data. Aanmaken: npx wrangler d1 create smarterwire  -> database_id hieronder invullen.
# Schema: npx wrangler d1 migrations apply smarterwire --remote 
# (lokaal gebruikt `npm run dev` een eigen D1 in .wrangler/, het id doet er dan niet toe)
[[d1_databases]]
binding = "DB"
database_name = "smarterwire"
database_id = "05e9c7a4-6cbc-43f9-a15f-1b9876562c6b"
migrations_dir = "cloudflare/migrations"

# Preview-builds (elke branch behalve main, `wrangler preview`) krijgen een EIGEN database, nooit de echte.
# Aanmaken + id invullen + migraties: workflow "D1 aanmaken" (maakt beide databases).
[[previews.d1_databases]]
binding = "DB"
database_name = "smarterwire-preview"
database_id = "VUL-IN-NA-WRANGLER-D1-CREATE"

# De gebouwde app (npm run build) wordt als statische assets geserveerd; enkel /api/* gaat langs de worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "wire.smarterhomes.be"
custom_domain = true
