name: D1 aanmaken

# Handmatig starten (ook vanop je gsm): GitHub → Actions → "D1 aanmaken" → Run workflow.
# Maakt de D1-database aan (als ze nog niet bestaat), schrijft het database_id in cloudflare/wrangler.toml
# en past de migraties toe.
# Vereist repository-secrets: CLOUDFLARE_API_TOKEN (rechten: D1 Edit) en CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Naam van de database
        default: smarterwire
        required: true

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Database aanmaken (als ze nog niet bestaat)
        run: |
          if npx wrangler d1 list --json | jq -e --arg n "$DB_NAME" 'map(select(.name==$n))|length>0' >/dev/null; then
            echo "Database $DB_NAME bestaat al."
          else
            npx wrangler d1 create "$DB_NAME"
          fi

      - name: database_id in wrangler.toml zetten
        run: |
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[]|select(.name==$n)|.uuid')
          test -n "$ID"
          sed -i -E "s|^database_name = .*|database_name = \"$DB_NAME\"|; s|^database_id = .*|database_id = \"$ID\"|" cloudflare/wrangler.toml
          echo "database_id = $ID"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "D1: database_id van $DB_NAME"
            git push
          fi

      - name: Migraties toepassen
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote -c cloudflare/wrangler.toml
